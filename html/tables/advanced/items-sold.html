<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Items sold summary</title>
    <link href="minimal-table.css" rel="stylesheet" type="text/css">
  </head>

<body>
    <h1>Items sold summary</h1>

    <table>
      <caption>Items Sold August 2016</caption>
      <thead>
        <tr>
          <td colspan="2" rowspan="2"></td>
          <th id="cloaths" colspan="3" scope="colgroup">Clothes</th>
          <th id="accessories" colspan="2" scope="colgroup">Accessories</th>
        </tr>
        <tr>
          <th scope="col" id="trousers" headers="cloaths">Trousers</th>
          <th scope="col" id="skirts" headers="cloaths">Skirts</th>
          <th scope="col" id="dresses" headers="cloaths">Dresses</th>
          <th scope="col" id="bracelets" headers="accessories">Bracelets</th>
          <th scope="col" id="rings" headers="accessories">Rings</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th id="belgium" rowspan="3" scope="rowgroup">Belgium</th>
          <th id="antwerp" scope="col">Antwerp</th>
          <td headers="belguim antwerp cloaths trousers">56</td>
          <td headers="belguim antwerp cloaths skirts">22</td>
          <td headers="belguim antwerp cloaths dresses">43</td>
          <td headers="belguim antwerp accessories bracelets">72</td>
          <td headers="belguim antwerp accessories rings">23</td>
        </tr>
        <tr>
          <th id="ghent" scope="row">Ghent</th>
          <td headers="belguim ghent cloaths trousers">46</td>
          <td headers="belguim ghent cloaths skirts">18</td>
          <td headers="belguim ghent cloaths dresses">50</td>
          <td headers="belgium ghent accessories bracelets">61</td>
          <td headers="belgium ghent accessories rings">15</td>
        </tr>
        <tr>
          <th id="brussels" scope="row">Brussels</th>
          <td headers="belguim brussels cloaths trousers">51</td>
          <td headers="belguim brussels cloaths skirts">27</td>
          <td headers="belguim brussels cloaths dresses">38</td>
          <td headers="belguim brussels accessories bracelets">69</td>
          <td headers="belguim brussels accessories rings">28</td>
        </tr>
        <tr>
          <th id="netherlands"rowspan="2" scope="rowgroup">The Netherlands</th>
          <th id="amsterdam" scope="row">Amsterdam</th>
          <td headers="netherlands amsterdam cloaths trousers">89</td>
          <td headers="netherlands amsterdam cloaths skirts">34</td>
          <td headers="netherlands amsterdam cloaths dresses">69</td>
          <td headers="netherlands amsterdam accessories bracelets">85</td>
          <td headers="netherlands amsterdam accessories rings">38</td>
        </tr>
        <tr>
          <th id="utrecht" scope="row">Utrecht</th>
          <td headers="netherlands utrecht cloaths trousers">80</td>
          <td headers="netherlands utrecht cloaths skirts">12</td>
          <td headers="netherlands utrecht cloaths dresses">43</td>
          <td headers="netherlands utrecht accessories bracelets">36</td>
          <td headers="netherlands utrecht accessories rings">19</td>
      </tbody>
    </table>

</body>

</html>
